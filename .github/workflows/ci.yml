name: CI - Content Service

on:
  push:
    branches:
      - main

env:
  SERVICE_NAME: content
  IMAGE_NAME: ghcr.io/minchae0322/content

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Run unit tests
        run: ./gradlew test

      - name: Upload test report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-report
          path: build/reports/tests/test
          retention-days: 7

      - name: Build with Gradle
        run: ./gradlew build -x test

      - name: Rename jar for Docker
        run: cp $(ls build/libs/*.jar | grep -v plain | head -1) app.jar

      - name: Login to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Build & Push Docker image
        run: |
          IMAGE_TAG="${{ github.sha }}"
          docker build -t ${{ env.IMAGE_NAME }}:${IMAGE_TAG} .
          docker push ${{ env.IMAGE_NAME }}:${IMAGE_TAG}

      - name: Update manifest repo
        run: |
          IMAGE_TAG="${{ github.sha }}"
          git clone https://x-access-token:${{ secrets.MANIFEST_REPO_TOKEN }}@github.com/Minchae0322/yogurtte-k8s-manifests.git
          cd yogurtte-k8s-manifests/apps/${{ env.SERVICE_NAME }}/overlays/dev

          sed -i "s|newTag:.*|newTag: ${IMAGE_TAG}|" kustomization.yaml

          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add .
          git commit -m "chore: update ${{ env.SERVICE_NAME }} image tag to ${IMAGE_TAG}"
          git push
