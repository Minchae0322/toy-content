name: CI - Content Service

on:
  push:
    branches:
      - main

env:
  SERVICE_NAME: content
  IMAGE_NAME: ghcr.io/minchae0322/content

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Login to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Build & Push Docker image
        run: |
          IMAGE_TAG="${{ github.sha }}"
          docker build -t ${{ env.IMAGE_NAME }}:${IMAGE_TAG} .
          docker push ${{ env.IMAGE_NAME }}:${IMAGE_TAG}

      - name: Update manifest repo
        run: |
          IMAGE_TAG="${{ github.sha }}"
          git clone https://x-access-token:${{ secrets.MANIFEST_REPO_TOKEN }}@github.com/Minchae0322/yogurtte-k8s-manifests.git
          cd yogurtte-k8s-manifests/apps/${{ env.SERVICE_NAME }}/overlays/dev

          sed -i "s|newTag:.*|newTag: ${IMAGE_TAG}|" kustomization.yaml

          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add .
          git commit -m "chore: update ${{ env.SERVICE_NAME }} image tag to ${IMAGE_TAG}"
          git push
