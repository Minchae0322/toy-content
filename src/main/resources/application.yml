spring:
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}  # 환경변수로 제어

  jpa:
    show-sql: false
    hibernate:
      ddl-auto: ${DDL_AUTO:update}
    properties:
      hibernate:
        format_sql: true
        jdbc:
          batch_size: 50
          order_inserts: true
          order_updates: true

  messages:
    basename: messages

  servlet:
    multipart:
      enabled: true
      max-file-size: 1GB
      max-request-size: 1GB
      file-size-threshold: 2KB

springdoc:
  api-docs:
    enabled: ${SWAGGER_ENABLED:true}
  swagger-ui:
    path: /swagger-ui.html

jwt:
  secret: ${JWT_SECRET}

scheduler:
  hot-score:
    enable: ${SCHEDULER_ENABLE:true}
    time-weight-update:
      cron: "0 0 * * * *"
      enabled: true
    full-recalculate:
      cron: "0 0 3 * * *"
      enabled: true