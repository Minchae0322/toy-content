spring:
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}  # 환경변수로 제어

  application:
    name: content-service                    # 메트릭/트레이스 라벨에 사용

  lifecycle:
    timeout-per-shutdown-phase: 30s          # graceful shutdown 최대 대기

  jpa:
    show-sql: false
    hibernate:
      ddl-auto: ${DDL_AUTO:update}
    properties:
      hibernate:
        format_sql: true
        # LAZY 연관을 IN 절로 묶어 초기화한다 (읽기 N+1 차단).
        # 아래 jdbc.batch_size는 쓰기(insert/update) 배치라 읽기와 무관하다 - 별개 설정.
        #
        # 계기: AU-4 장애 주입 회차 1(2026-07-27)의 트레이스에서 /feeds/scroll이 피드 11건에
        # 쿼리 23회를 쏘는 것이 관측됐다 - ListView.from이 피드마다 feed.getCategory()(ManyToOne),
        # feed.getHashtags()(OneToMany)를 개별 초기화했다. 상세는 rca-agent NF-11.
        # 컬렉션 fetch join은 커서 페이징과 함께 쓰면 메모리 페이징(HHH000104)으로 빠지므로
        # batch fetch로 해결한다. 쿼리 수는 늘지 않고 줄기만 한다.
        default_batch_fetch_size: 100
        jdbc:
          batch_size: 50
          order_inserts: true
          order_updates: true

  messages:
    basename: messages

  servlet:
    multipart:
      enabled: true
      max-file-size: 1GB
      max-request-size: 1GB
      file-size-threshold: 2KB

server:
  shutdown: graceful                         # Pod 종료 시 in-flight 요청 보호

# ============================================
# Actuator — 관리 포트(8090) 분리
# ============================================
management:
  server:
    port: 8090
  endpoints:
    web:
      base-path: /actuator
      exposure:
        include: health, info, prometheus
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true
      group:
        liveness:
          include: livenessState
        readiness:
          include: readinessState, db, redis
  info:
    env:
      enabled: true
    git:
      mode: full
    build:
      enabled: true
  metrics:
    tags:
      application: ${spring.application.name}
    distribution:
      percentiles-histogram:
        http.server.requests: false
      slo:
        http.server.requests: 5ms, 10ms, 20ms, 30ms, 50ms, 75ms, 100ms, 150ms, 200ms, 300ms, 500ms, 1s, 2s, 5s
    enable:
      jvm.memory: true
      jvm.gc: true
      jvm.threads: true
      hikaricp: true
      http.server.requests: true
      tomcat.threads: true
      logback: true
      jvm.classes: false       # 카디널리티 폭증 방어
      jvm.buffer: false
      jdbc: false
      tomcat.cache: false
      tomcat.servlet: false
  tracing:
    propagation:
      type: w3c
    sampling:
      probability: ${TRACING_SAMPLING_RATE:1.0}
  zipkin:
    tracing:
      endpoint: ${TEMPO_ZIPKIN_ENDPOINT:http://tempo.monitoring:9411/api/v2/spans}

logging:
  pattern:
    level: "%5p [traceId=%X{traceId:-NONE},spanId=%X{spanId:-NONE},userId=%X{userId:-NONE}]"

springdoc:
  api-docs:
    enabled: ${SWAGGER_ENABLED:true}
  swagger-ui:
    path: /swagger-ui.html

jwt:
  secret: ${JWT_SECRET}

app:
  reward:
    daily-exp-cap: 1000
    time-zone: Asia/Seoul

feed:
  hot:
    min-views: ${FEED_HOT_MIN_VIEWS:5}    # 핫 목록 노출 자격 최소 조회수 (0이면 비활성)

# 핫 스코어 시간 상수(초). Reddit식 log10(참여도) + 기준시각/상수 — "참여도 10배 = 이 시간".
# 값을 바꾸면 저장된 점수 기준이 달라지므로 관리자 API(/admin/schedulers/*.recalculate)로 전체 재계산을 한 번 돌린다.
hot-score:
  feed-time-divisor-seconds: ${FEED_HOT_SCORE_TIME_DIVISOR:1209600}        # 14일
  battle-time-divisor-seconds: ${BATTLE_HOT_SCORE_TIME_DIVISOR:2592000}    # 30일
  product-time-divisor-seconds: ${PRODUCT_POPULARITY_TIME_DIVISOR:2592000} # 30일

