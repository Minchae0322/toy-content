server:
  port: 8082
  servlet:
    context-path: /api
  tomcat:
    threads:
      max: 40              # Hikari 20 × 2
      min-spare: 5         # 50 → 5 (idle 절약)
    max-connections: 400   # threads.max × 10
    accept-count: 100      # 큐 크기

spring:
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://${DB_HOST:dev-mysql-server}:3306/content?sslMode=PREFERRED&serverTimezone=Asia/Seoul&characterEncoding=UTF-8
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: 20
      minimum-idle: 3
      connection-timeout: 10000
      idle-timeout: 300000
      max-lifetime: 1200000
      leak-detection-threshold: 60000  # 디버깅용 추가

  data:
    redis:
      host: ${REDIS_HOST:dev-redis-server}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: 2000ms
      lettuce:
        pool:
          max-active: 30
          max-idle: 20
          min-idle: 5

  jpa:
    show-sql: false
    hibernate:
      ddl-auto: update  # 개발에서는 validate 권장

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS}
    topic:
      notification: user.notifications
      notification-dlq: user.notifications.dlq
    producer:
      acks: all
      retries: 3
      batch-size: 16384
      linger-ms: 10
      buffer-memory: 33554432
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.kafka.KafkaAutoConfiguration

kafka:
  enabled: true

# Actuator 설정
management:
  endpoints:
    web:
      base-path: /actuator
      exposure:
        include: health, info, prometheus
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true
      group:
        liveness:
          include: livenessState
        readiness:
          include: readinessState, db, redis
  metrics:
    tags:
      application: ${spring.application.name:content-service}
    distribution:
      percentiles-histogram:
        http.server.requests: true
      percentiles:
        http.server.requests: 0.5, 0.95, 0.99
    enable:
      # 핵심 (꼭 필요)
      jvm.memory: true
      jvm.gc: true
      jvm.threads: true
      hikaricp: true
      http.server.requests: true
      tomcat.threads: true
      logback: true
      # 비활성화 (카디널리티 폭증 위험)
      jvm.classes: false
      jvm.buffer: false
      jdbc: false
      tomcat.cache: false
      tomcat.servlet: false
  tracing:
    sampling:
      probability: 1.0
  zipkin:
    tracing:
      endpoint: http://tempo.monitoring:9411/api/v2/spans

external:
  user-service:
    protocol: http
    host: ${USER_SERVICE_HOST:auth-service}
    port: ${USER_SERVICE_PORT:8081}
    api-key: ${USER_SERVICE_API_KEY}

file:
  upload:
    path: ${FILE_UPLOAD_PATH:/app/uploads/}

jwt:
  secret: ${JWT_SECRET}


scheduler:
  product-popularity:
    time-weight-update:
      cron: "0 30 * * * *"
      enabled: ${PRODUCT_POPULARITY_TIME_WEIGHT_ENABLED:true}
    full-recalculate:
      cron: "0 0 1 * * *"
      enabled: ${PRODUCT_POPULARITY_FULL_RECALC_ENABLED:true}
  hot-score:
    time-weight-update:
      cron: "0 0 * * * *"
      enabled: ${BATTLE_HOT_SCORE_TIME_WEIGHT_ENABLED:true}
    full-recalculate:
      cron: "0 0 2 * * *"
      enabled: ${BATTLE_HOT_SCORE_FULL_RECALC_ENABLED:true}
  feed-trending:
    enabled: ${FEED_TRENDING_ENABLE:true}
    threshold: ${FEED_TRENDING_THRESHOLD:10}
    cron: "0 15 0 * * *"
  feed-hot-score:
    time-weight-update:
      cron: "0 0 * * * *"
      enabled: ${FEED_HOT_SCORE_TIME_WEIGHT_ENABLED:true}
    full-recalculate:
      cron: "0 0 3 * * *"
      enabled: ${FEED_HOT_SCORE_FULL_RECALC_ENABLED:true}
      recent-days: ${FEED_HOT_SCORE_RECENT_DAYS:30}

springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    path: /swagger-ui.html

logging:
  level:
    root: INFO
    com.example.toycontent: DEBUG       # root: INFO 는 기본값이라 제거
  pattern:
    level: "%5p [traceId=%X{traceId:-NONE},spanId=%X{spanId:-NONE},userId=%X{userId:-NONE}]"
    # console을 오버라이드할 때는 ${LOG_LEVEL_PATTERN}을 넣어 pattern.level을 끌어옴
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] ${LOG_LEVEL_PATTERN:-%5p} %logger{36} - %msg%n"
    file:    "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] ${LOG_LEVEL_PATTERN:-%5p} %logger{36} - %msg%n"
  file:
    name: /logs/application.log
  logback:
    rollingpolicy:
      max-file-size: 10MB
      max-history: 30
      total-size-cap: 1GB
