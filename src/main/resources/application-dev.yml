server:
  port: 8082
  shutdown: graceful                            # ➕ Pod 종료 시 in-flight 요청 보호
  servlet:
    context-path: /api
  tomcat:
    threads:
      max: 40              # Hikari 20 × 2
      min-spare: 5         # 50 → 5 (idle 절약)
    max-connections: 400   # threads.max × 10
    accept-count: 100      # 큐 크기

spring:
  application:
    name: content-service                       # ➕ 메트릭/트레이스 라벨에 사용
  lifecycle:
    timeout-per-shutdown-phase: 30s             # ➕ graceful shutdown 최대 대기

  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://${DB_HOST:dev-mysql-server}:3306/content?sslMode=PREFERRED&serverTimezone=Asia/Seoul&characterEncoding=UTF-8
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: 20
      minimum-idle: 3
      connection-timeout: 10000
      idle-timeout: 300000
      max-lifetime: 1200000
      leak-detection-threshold: 60000  # 디버깅용 추가

  data:
    redis:
      host: ${REDIS_HOST:dev-redis-server}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: 2000ms
      lettuce:
        pool:
          max-active: 30
          max-idle: 20
          min-idle: 5

  jpa:
    show-sql: false
    hibernate:
      ddl-auto: update  # 개발에서는 validate 권장

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS}
    topic:
      notification: user.notifications
      notification-dlq: user.notifications.dlq
    producer:
      acks: all
      retries: 3
      batch-size: 16384
      linger-ms: 10
      buffer-memory: 33554432
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.kafka.KafkaAutoConfiguration

kafka:
  enabled: true

# ============================================
# Actuator — 관리 포트(8090) 분리
# ============================================
management:
  server:
    port: 8090                                  # ➕ 별도 포트로 분리
    # address 미지정 = 0.0.0.0 (vmagent 접근 위해 필요, NetworkPolicy/SG로 차단)
  endpoints:
    web:
      base-path: /actuator                      # 8090 분리 시 context-path /api 무관
      exposure:
        include: health, info, prometheus
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true
      group:
        liveness:
          include: livenessState
        readiness:
          include: readinessState, db, redis
  info:                                         # ➕ 배포 버전 식별용
    env:
      enabled: true
    git:
      mode: full
    build:
      enabled: true
  metrics:
    tags:
      application: ${spring.application.name}
    distribution:
      percentiles-histogram:
        http.server.requests: true
      percentiles:
        http.server.requests: 0.5, 0.95, 0.99
      slo:                                      # ➕ SLO 버킷 (SLA 모니터링)
        http.server.requests: 100ms, 200ms, 500ms, 1s, 2s
      minimum-expected-value:
        http.server.requests: 10ms
      maximum-expected-value:
        http.server.requests: 10s
    enable:
      # 핵심 (꼭 필요)
      jvm.memory: true
      jvm.gc: true
      jvm.threads: true
      hikaricp: true
      http.server.requests: true
      tomcat.threads: true
      logback: true
      # 비활성화 (카디널리티 폭증 위험)
      jvm.classes: false
      jvm.buffer: false
      jdbc: false
      tomcat.cache: false
      tomcat.servlet: false
  tracing:
    propagation:
      type: w3c                                 # ➕ MSA 간 trace 전파 — W3C 표준 (Auth/Chat 동일)
    sampling:
      probability: ${TRACING_SAMPLING_RATE:1.0} # ➕ 환경변수로 제어 (운영에선 0.1 등)
  zipkin:
    tracing:
      endpoint: ${TEMPO_ZIPKIN_ENDPOINT:http://tempo.monitoring:9411/api/v2/spans}
      # ➕ 모니터링 EC2 IP를 환경변수로

# ============================================
# 외부 서비스
# ============================================
external:
  user-service:
    protocol: http
    host: ${USER_SERVICE_HOST:auth-service}
    port: ${USER_SERVICE_PORT:8081}
    api-key: ${USER_SERVICE_API_KEY}

file:
  upload:
    path: ${FILE_UPLOAD_PATH:/app/uploads/}

jwt:
  secret: ${JWT_SECRET}

# ============================================
# 스케줄러
# ============================================
scheduler:
  feed-trending:
    enabled: ${FEED_TRENDING_ENABLE:true}
    threshold: ${FEED_TRENDING_THRESHOLD:10}
    cron: "0 15 0 * * *"

springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    path: /swagger-ui.html

# ============================================
# 로깅 — MDC userId/traceId 패턴 유지
# ============================================
logging:
  level:
    root: INFO
    com.example.toycontent: DEBUG
  pattern:
    level: "%5p [traceId=%X{traceId:-NONE},spanId=%X{spanId:-NONE},userId=%X{userId:-NONE}]"
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] ${LOG_LEVEL_PATTERN:-%5p} %logger{36} - %msg%n"
    file:    "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] ${LOG_LEVEL_PATTERN:-%5p} %logger{36} - %msg%n"
  file:
    name: /logs/application.log
  logback:
    rollingpolicy:
      max-file-size: 10MB
      max-history: 30
      total-size-cap: 1GB