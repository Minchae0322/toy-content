server:
  port: 8082
  servlet:
    context-path: /api

spring:
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://${DB_HOST:dev-mysql-server}:3306/content?serverTimezone=Asia/Seoul&characterEncoding=UTF-8
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5
      connection-timeout: 30000

  data:
    redis:
      host: ${REDIS_HOST:dev-redis-server}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: 2000ms
      lettuce:
        pool:
          max-active: 8
          max-wait: -1ms
          max-idle: 8
          min-idle: 0

  jpa:
    show-sql: false
    hibernate:
      ddl-auto: update  # 개발에서는 validate 권장

external:
  user-service:
    protocol: http
    host: ${USER_SERVICE_HOST:dev-user-service}
    port: ${USER_SERVICE_PORT:8081}
    api-key: ${USER_SERVICE_API_KEY}

file:
  upload:
    path: ${FILE_UPLOAD_PATH:/app/uploads/}

jwt:
  secret: ${JWT_SECRET}


scheduler:
  product-popularity:
    time-weight-update:
      cron: "0 0 * * * *"
      enabled: ${PRODUCT_POPULARITY_TIME_WEIGHT_ENABLED:true}
    full-recalculate:
      cron: "0 0 3 * * *"
      enabled: ${PRODUCT_POPULARITY_FULL_RECALC_ENABLED:true}
  hot-score:
    time-weight-update:
      cron: "0 0 * * * *"
      enabled: ${HOT_SCORE_TIME_WEIGHT_ENABLED:true}
    full-recalculate:
      cron: "0 0 3 * * *"
      enabled: ${HOT_SCORE_FULL_RECALC_ENABLED:true}

springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    path: /swagger-ui.html

logging:
  level:
    root: INFO
