server:
  port: 8082
  servlet:
    context-path: /api
  tomcat:
    threads:
      max: 40              # Hikari 20 × 2
      min-spare: 5         # 50 → 5 (idle 절약)
    max-connections: 400   # threads.max × 10
    accept-count: 100      # 큐 크기

spring:
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://${DB_HOST:dev-mysql-server}:3306/content?serverTimezone=Asia/Seoul&characterEncoding=UTF-8
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: 20
      minimum-idle: 3        # 20 → 3 (idle 절약)
      connection-timeout: 3000  # 30000 → 3000 (Fail Fast)
      idle-timeout: 300000
      max-lifetime: 1200000

  data:
    redis:
      host: ${REDIS_HOST:dev-redis-server}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: 2000ms
      lettuce:
        pool:
          max-active: 30
          max-idle: 20
          min-idle: 5

  jpa:
    show-sql: false
    hibernate:
      ddl-auto: update  # 개발에서는 validate 권장

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS}
    topic:
      notification: user.notifications
      notification-dlq: user.notifications.dlq
    producer:
      acks: all
      retries: 3
      batch-size: 16384
      linger-ms: 10
      buffer-memory: 33554432
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.kafka.KafkaAutoConfiguration

kafka:
  enabled: true

# Actuator 설정
management:
  endpoints:
    web:
      base-path: /actuator
      exposure:
        include: health, info, prometheus
  endpoint:
    health:
      show-details: never  # 상세정보 숨김 (보안)
      probes:
        enabled: true      # liveness, readiness probe 활성화
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true
  metrics:
    tags:
      application: ${spring.application.name:content-service}

external:
  user-service:
    protocol: http
    host: ${USER_SERVICE_HOST:dev-user-service}
    port: ${USER_SERVICE_PORT:8081}
    api-key: ${USER_SERVICE_API_KEY}

file:
  upload:
    path: ${FILE_UPLOAD_PATH:/app/uploads/}

jwt:
  secret: ${JWT_SECRET}


scheduler:
  product-popularity:
    time-weight-update:
      cron: "0 30 * * * *"
      enabled: ${PRODUCT_POPULARITY_TIME_WEIGHT_ENABLED:true}
    full-recalculate:
      cron: "0 0 1 * * *"
      enabled: ${PRODUCT_POPULARITY_FULL_RECALC_ENABLED:true}
  hot-score:
    time-weight-update:
      cron: "0 0 * * * *"
      enabled: ${BATTLE_HOT_SCORE_TIME_WEIGHT_ENABLED:true}
    full-recalculate:
      cron: "0 0 2 * * *"
      enabled: ${BATTLE_HOT_SCORE_FULL_RECALC_ENABLED:true}
  feed-trending:
    enabled: ${FEED_TRENDING_ENABLE:true}
    threshold: ${FEED_TRENDING_THRESHOLD:10}
    cron: "0 15 0 * * *"
  feed-hot-score:
    time-weight-update:
      cron: "0 0 * * * *"
      enabled: ${FEED_HOT_SCORE_TIME_WEIGHT_ENABLED:true}
    full-recalculate:
      cron: "0 0 3 * * *"
      enabled: ${FEED_HOT_SCORE_FULL_RECALC_ENABLED:true}
      recent-days: ${FEED_HOT_SCORE_RECENT_DAYS:30}

springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    path: /swagger-ui.html

logging:
  level:
    root: INFO
    com.example.toycontent: DEBUG
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"
  file:
    name: /logs/application.log
  logback:
    rollingpolicy:
      max-file-size: 10MB
      max-history: 30
      total-size-cap: 1GB

