server:
  port: 8082
  servlet:
    context-path: /api

spring:
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://${DB_HOST:dev-mysql-server}:3306/content?serverTimezone=Asia/Seoul&characterEncoding=UTF-8
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5
      connection-timeout: 30000

  data:
    redis:
      host: ${REDIS_HOST:dev-redis-server}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: 2000ms
      lettuce:
        pool:
          max-active: 8
          max-wait: -1ms
          max-idle: 8
          min-idle: 0

  jpa:
    show-sql: false
    hibernate:
      ddl-auto: update  # 개발에서는 validate 권장

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS}
    topic:
      notification: user.notifications
      notification-dlq: user.notifications.dlq
    producer:
      acks: all
      retries: 3
      batch-size: 16384
      linger-ms: 10
      buffer-memory: 33554432
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.kafka.KafkaAutoConfiguration

kafka:
  enabled: false

# Actuator 설정
management:
  endpoints:
    web:
      base-path: /actuator
      exposure:
        include: health, info
  endpoint:
    health:
      show-details: never  # 상세정보 숨김 (보안)
      probes:
        enabled: true      # liveness, readiness probe 활성화
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true

external:
  user-service:
    protocol: http
    host: ${USER_SERVICE_HOST:dev-user-service}
    port: ${USER_SERVICE_PORT:8081}
    api-key: ${USER_SERVICE_API_KEY}

file:
  upload:
    path: ${FILE_UPLOAD_PATH:/app/uploads/}

jwt:
  secret: ${JWT_SECRET}


scheduler:
  product-popularity:
    time-weight-update:
      cron: "0 0 * * * *"
      enabled: ${PRODUCT_POPULARITY_TIME_WEIGHT_ENABLED:true}
    full-recalculate:
      cron: "0 0 3 * * *"
      enabled: ${PRODUCT_POPULARITY_FULL_RECALC_ENABLED:true}
  hot-score:
    time-weight-update:
      cron: "0 0 * * * *"
      enabled: ${BATTLE_HOT_SCORE_TIME_WEIGHT_ENABLED:true}
    full-recalculate:
      cron: "0 0 3 * * *"
      enabled: ${BATTLE_HOT_SCORE_FULL_RECALC_ENABLED:true}
  feed-trending:
    enabled: ${FEED_TRENDING_ENABLE:true}
    threshold: ${FEED_TRENDING_THRESHOLD:50}
    cron: "0 0 0 * * *"

springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    path: /swagger-ui.html

logging:
  level:
    root: INFO
    com.example.toycontent: DEBUG
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"
  file:
    name: /logs/application.log
  logback:
    rollingpolicy:
      max-file-size: 10MB
      max-history: 30
      total-size-cap: 1GB

