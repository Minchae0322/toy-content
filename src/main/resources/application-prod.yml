server:
  port: 8082
  servlet:
    context-path: /api
  shutdown: graceful  # 운영에서는 graceful shutdown

spring:
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://${DB_HOST}:3306/content?serverTimezone=Asia/Seoul&characterEncoding=UTF-8&useSSL=true&requireSSL=true
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: 20
      minimum-idle: 10
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000

  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD}
      timeout: 2000ms
      lettuce:
        pool:
          max-active: 16
          max-wait: -1ms
          max-idle: 16
          min-idle: 4

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS}
    producer:
      acks: all
      retries: 3
      batch-size: 16384
      linger-ms: 5
      buffer-memory: 33554432
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      properties:
        enable.idempotence: true

  jpa:
    show-sql: false
    hibernate:
      ddl-auto: none  # 운영에서는 반드시 none

# Actuator 설정
management:
  endpoints:
    web:
      base-path: /actuator
      exposure:
        include: health, info
  endpoint:
    health:
      show-details: never  # 상세정보 숨김 (보안)
      probes:
        enabled: true      # liveness, readiness probe 활성화
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true

external:
  user-service:
    protocol: https
    host: ${USER_SERVICE_HOST}
    port: ${USER_SERVICE_PORT:443}
    api-key: ${USER_SERVICE_API_KEY}

file:
  upload:
    path: ${FILE_UPLOAD_PATH:/app/uploads/}

jwt:
  secret: ${JWT_SECRET}

springdoc:
  api-docs:
    enabled: false  # 운영에서는 Swagger 비활성화
  swagger-ui:
    path: /swagger-ui.html

scheduler:
  product-popularity:
    time-weight-update:
      cron: "0 0 * * * *"
      enabled: ${PRODUCT_POPULARITY_TIME_WEIGHT_ENABLED:true}
    full-recalculate:
      cron: "0 0 3 * * *"
      enabled: ${PRODUCT_POPULARITY_FULL_RECALC_ENABLED:true}
  hot-score:
    time-weight-update:
      cron: "0 0 * * * *"
      enabled: ${BATTLE_HOT_SCORE_TIME_WEIGHT_ENABLED:true}
    full-recalculate:
      cron: "0 0 3 * * *"
      enabled: ${BATTLE_HOT_SCORE_FULL_RECALC_ENABLED:true}
  feed-trending:
    enabled: ${FEED_TRENDING_ENABLE:true}
    threshold: ${FEED_TRENDING_THRESHOLD:50}
    cron: "0 0 0 * * *"


logging:
  level:
    root: INFO
    com.example.toycontent: DEBUG
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"
  # file 설정 없이 stdout만 사용

